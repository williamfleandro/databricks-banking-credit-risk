    default: mlops_dev
  schema_name:
    description: Unity Catalog schema
    default: banking

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-710d747d-f005.cloud.databricks.com
